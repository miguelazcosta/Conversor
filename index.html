<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conversor</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <figure>
        <img src="./assets/logo.gif" alt="Logo">
    </figure>

    <main>

        <label>
            <p class="tipo-moeda" id="from">Converter <b>de</b></p>
            <select id="pre-currency">
                <option value="real">R$ - Real Brasileiro</option>
                <option value="dolar">U$ - Dólar Americano</option>
                <option value="euro">€€ - Euro Europeu</option>
                <option value="libra">££ - Libra Esterlina</option>
                <option value="bitcoin">₿₿ - Bitcoin </option>
            </select>
        </label>
        <label>
            <p class="tipo-moeda" id="to">Converter <b>para</b></p>
            <select id="aft-currency">
                <option value="dolar">U$ - Dólar Americano</option>
                <option value="real">R$ - Real Brasileiro</option>
                <option value="euro">€€ - Euro Europeu</option>
                <option value="libra">££ - Libra Esterlina</option>
                <option value="bitcoin">₿₿ - Bitcoin </option>

            </select>
        </label>



        <label>
            <p class="tipo-moeda" id="value">Valor</p>
            <input id="input" placeholder="R$  10.000,00">
        </label>

        <label>
            <button id="convert">Convert</button>
        </label>



        <section>
            <div>
                <img src="./assets/real.png" alt="Real Symbol" class="symbol" id="currency-img1">
                <p class="moeda" id="currency-name1">Real</p>
                <p class="valor" id="pre-convertion">R$ 0,00</p>
            </div>
            <div>
                <img src="./assets/arrow.png" alt="arrow" id="arrow">
            </div>
            <div>
                <img src="./assets/dollar.png" alt="Euro Symbol" class="symbol" id="currency-img2">
                <p class="moeda" id="currency-name2">Dólar</p>
                <p class="valor" id="aft-convertion">$0,00</p>
            </div>
        </section>
    </main>
    <script src="./scripts.js"></script>
</body>
</html>
